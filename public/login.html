<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In — Sree Sivasakthi Dairy Farm</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/theme-light-blue.css">
</head>
<body>

<header class="site">
  <div class="nav">
    <a class="brand" href="index.html" style="text-decoration:none;">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" fill="var(--primary-tint)" stroke="var(--primary)" stroke-width="1.4"/>
        <path d="M16 11h8l1.4 4.4c.5 1.6.9 3.3.9 5v9.1c0 1.4-1.1 2.5-2.5 2.5h-7.6a2.5 2.5 0 0 1-2.5-2.5v-9.1c0-1.7.4-3.4.9-5L16 11Z" stroke="var(--primary)" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M15.4 13.5h9.2" stroke="var(--primary)" stroke-width="1.5"/>
        <path d="M14.5 21c1.3.9 2.4 1.2 3.5.4 1.3-.9 2.2-.9 3.5 0 1.3.9 2.2.9 3.5 0" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <div class="name">Sree Sivasakthi Dairy Farm</div>
        <div class="tag">FRESH FROM FARM, DAILY</div>
      </div>
    </a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="register.html" id="headerRegisterLink">Create account</a>
    </nav>
  </div>
</header>

<div class="wrap auth-shell">
  <div class="auth-card" style="max-width:440px;">
    <div class="auth-head">
      <div class="eyebrow-sm">welcome back</div>
      <h1>Log In</h1>
      <p>Enter your mobile number and password to view your dashboard.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field-grid">
        <div class="field full" data-field="mobileNumber">
          <label for="mobileNumber">Mobile number</label>
          <input id="mobileNumber" name="mobileNumber" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" required>
          <div class="error-text"></div>
        </div>
        <div class="field full" data-field="password">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <div class="error-text"></div>
        </div>
      </div>

      <div class="form-banner" id="formBanner" role="alert"></div>

      <div class="auth-actions">
        <span class="switch-link">New here? <a href="register.html" id="switchRegisterLink">Create an account</a></span>
        <button type="submit" class="btn btn-primary" id="submitBtn">Log In</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('loginForm');
  var banner = document.getElementById('formBanner');
  var submitBtn = document.getElementById('submitBtn');

  // Carry an "Order Now" (or similar) return destination through login too.
  function safeNext(path) {
    if (!path) return null;
    if (path.indexOf('://') !== -1) return null;
    if (path.indexOf('//') === 0) return null;
    return path;
  }
  var nextParam = safeNext(new URLSearchParams(window.location.search).get('next'));
  var postAuthDest = nextParam || 'dashboard.html';
  if (nextParam) {
    var registerNext = '?next=' + encodeURIComponent(nextParam);
    var headerRegisterLink = document.getElementById('headerRegisterLink');
    var switchRegisterLink = document.getElementById('switchRegisterLink');
    if (headerRegisterLink) headerRegisterLink.href = 'register.html' + registerNext;
    if (switchRegisterLink) switchRegisterLink.href = 'register.html' + registerNext;
  }

  function fieldEl(name) { return form.querySelector('[data-field="' + name + '"]'); }
  function setFieldError(name, message) {
    var el = fieldEl(name);
    if (!el) return;
    var errEl = el.querySelector('.error-text');
    if (message) { el.classList.add('has-error'); if (errEl) errEl.textContent = message; }
    else { el.classList.remove('has-error'); if (errEl) errEl.textContent = ''; }
  }
  function clearAllErrors() {
    Array.prototype.forEach.call(form.querySelectorAll('.field'), function (el) {
      el.classList.remove('has-error');
      var errEl = el.querySelector('.error-text');
      if (errEl) errEl.textContent = '';
    });
  }
  function showBanner(kind, message) {
    banner.className = 'form-banner show ' + kind;
    banner.textContent = message;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    banner.className = 'form-banner';
    clearAllErrors();

    var mobileNumber = document.getElementById('mobileNumber').value.trim();
    var password = document.getElementById('password').value;

    if (!mobileNumber) { setFieldError('mobileNumber', 'Mobile number is required.'); }
    if (!password) { setFieldError('password', 'Password is required.'); }
    if (!mobileNumber || !password) {
      showBanner('error', 'Please fill in both fields.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ mobileNumber: mobileNumber, password: password }),
    })
      .then(function (res) { return res.json().then(function (data) { return { status: res.status, data: data }; }); })
      .then(function (result) {
        if (result.status === 200) {
          window.location.href = postAuthDest;
          return;
        }
        showBanner('error', (result.data && result.data.message) || 'Mobile number or password is incorrect.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      })
      .catch(function () {
        showBanner('error', 'Could not reach the server. Make sure it is running and try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      });
  });
})();
</script>
</body>
</html>
